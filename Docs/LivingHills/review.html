<!doctype html><html lang="de"><meta charset="utf-8"><title>Burning Hills – Landschaft und Stadtleben</title><style>body{margin:30px;background:#17241c;color:#eee9cf;font:16px system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}figure{margin:0;background:#25382b;padding:12px;border-radius:10px}img{width:100%;height:auto}p{font-size:14px;line-height:1.5}a{color:#e7c47c}</style><h1>Burning Hills – Landschaft und Stadtleben</h1><p>Echte Unity Game View. Agentenprüfung, keine manuelle Gesamtspiel-Abnahme. <a href="REPORT.md">Prüfbericht</a></p><main><figure><a href="Screenshots/00_town_overview.png"><img loading="lazy" src="Screenshots/00_town_overview.png"></a><figcaption>00_town_overview.png<p>Kupferrote Hügel rahmen die Bezirke ein; bestehende Bauplätze, Straßen und Fluss bleiben erkennbar und frei.</p></figcaption></figure><figure><a href="Screenshots/district_Farm.png"><img loading="lazy" src="Screenshots/district_Farm.png"></a><figcaption>district_Farm.png<p>Farmgebäude, Anbauplätze und bestehende Farmförderstrecken bleiben unverändert; zusätzliche Figuren stehen außerhalb der Bauflächen.</p></figcaption></figure><figure><a href="Screenshots/expansion_Farm.png"><img loading="lazy" src="Screenshots/expansion_Farm.png"></a><figcaption>expansion_Farm.png<p>Östliche Anbauplätze und Farmwege bleiben frei; Kupferhügel markieren die äußere Landschaft.</p></figcaption></figure><figure><a href="Screenshots/district_City.png"><img loading="lazy" src="Screenshots/district_City.png"></a><figcaption>district_City.png<p>Stadtzentrum mit Garten, Café und Passanten; bestehende Gebäudestellung und Straßenführung bleiben erhalten.</p></figcaption></figure><figure><a href="Screenshots/expansion_City.png"><img loading="lazy" src="Screenshots/expansion_City.png"></a><figcaption>expansion_City.png<p>Südliches Stadtende mit Cafégruppen, Baumrand und offener Straße; keine neuen Sichtbarrieren vor Gebäuden.</p></figcaption></figure><figure><a href="Screenshots/district_Settlement.png"><img loading="lazy" src="Screenshots/district_Settlement.png"></a><figcaption>district_Settlement.png<p>Wohngebiet mit Passanten auf gespeicherten Wegen; Hausgruppen bleiben frei sichtbar.</p></figcaption></figure><figure><a href="Screenshots/expansion_Settlement.png"><img loading="lazy" src="Screenshots/expansion_Settlement.png"></a><figcaption>expansion_Settlement.png<p>Nördliche Wohnhäuser bleiben vor Baum- und Hügelkulisse sichtbar; Bewohner sind auf den Wegen platziert.</p></figcaption></figure><figure><a href="Screenshots/district_Industry.png"><img loading="lazy" src="Screenshots/district_Industry.png"></a><figcaption>district_Industry.png<p>Bäckereien bleiben straßenseitig erschlossen; neue Figuren und Landschaft überdecken keine Anschlüsse.</p></figcaption></figure><figure><a href="Screenshots/expansion_Industry.png"><img loading="lazy" src="Screenshots/expansion_Industry.png"></a><figcaption>expansion_Industry.png<p>Westliches Industrieende bleibt erreichbar und übersichtlich; Hügel stehen hinter den Bäckereireihen.</p></figcaption></figure><figure><a href="Screenshots/01_civic_garden.png"><img loading="lazy" src="Screenshots/01_civic_garden.png"></a><figcaption>01_civic_garden.png<p>Rathausgarten mit Café, Wimpeln und Passanten; Rathaus und Stadtlager bleiben lesbar.</p></figcaption></figure><figure><a href="Screenshots/02_welcome.png"><img loading="lazy" src="Screenshots/02_welcome.png"></a><figcaption>02_welcome.png<p>Ortsschild am begrünten Stadteingang, Radfahrer auf dem Weg; keine rechteckige Atlasfläche sichtbar.</p></figcaption></figure><figure><a href="Screenshots/03_cafe_life_a.png"><img loading="lazy" src="Screenshots/03_cafe_life_a.png"></a><figcaption>03_cafe_life_a.png<p>Versetzte Cafégruppe steht links der Bank; Mila ist vollständig sichtbar, eine Passantin bewegt sich auf der Straße.</p></figcaption></figure><figure><a href="Screenshots/04_cafe_life_b.png"><img loading="lazy" src="Screenshots/04_cafe_life_b.png"></a><figcaption>04_cafe_life_b.png<p>Gleiche Kamera mit späterem Bewegungszeitpunkt; Passantin weiter rechts auf dem Weg, Mila bleibt frei sichtbar.</p></figcaption></figure><figure><a href="Screenshots/05_copper_hills.png"><img loading="lazy" src="Screenshots/05_copper_hills.png"></a><figcaption>05_copper_hills.png<p>Zwei begrünte kupferrote Hügelmotive passen zu den warmen Baumfarben; spielbare Gebäude liegen vor der Landschaft.</p></figcaption></figure><figure><a href="Screenshots/06_old_kiln.png"><img loading="lazy" src="Screenshots/06_old_kiln.png"></a><figcaption>06_old_kiln.png<p>Alter Ziegelofen in einem Garten mit verbundenen Fußwegen, Wimpeln und Spaziergängern. Die Hügel sind als Hintergrundmotive ausgelegt.</p></figcaption></figure><figure><a href="Screenshots/07_hill_trails.png"><img loading="lazy" src="Screenshots/07_hill_trails.png"></a><figcaption>07_hill_trails.png<p>Bewachsene Felsstufen und gemalte Wanderpfade bilden einen natürlichen Rahmen außerhalb der Bauplätze.</p></figcaption></figure><figure><a href="Screenshots/08_swallow_pond_a.png"><img loading="lazy" src="Screenshots/08_swallow_pond_a.png"></a><figcaption>08_swallow_pond_a.png<p>Teich und Flussufer bleiben frei; kleine Schwalben und Schmetterlinge ergänzen die vorhandene Vegetation.</p></figcaption></figure><figure><a href="Screenshots/09_swallow_pond_b.png"><img loading="lazy" src="Screenshots/09_swallow_pond_b.png"></a><figcaption>09_swallow_pond_b.png<p>Späterer Flugzeitpunkt über dem gleichen Teich; kleine Tiermotive bleiben als dezente Umgebungselemente angelegt.</p></figcaption></figure><figure><a href="Screenshots/10_settlement.png"><img loading="lazy" src="Screenshots/10_settlement.png"></a><figcaption>10_settlement.png<p>Bewohner auf den Wegen der oberen Siedlung; Hügel und Baumgruppen liegen hinter den Häusern.</p></figcaption></figure><figure><a href="Screenshots/11_farm_walk.png"><img loading="lazy" src="Screenshots/11_farm_walk.png"></a><figcaption>11_farm_walk.png<p>Café und Blumenbogen bilden einen Treffpunkt am Farmspazierweg; Farmgebäude und Lagerzugang bleiben frei.</p></figcaption></figure><figure><a href="Screenshots/menu_1366x768.png"><img loading="lazy" src="Screenshots/menu_1366x768.png"></a><figcaption>menu_1366x768.png<p>Gebäudemenü bei 115 Prozent UI-Skalierung vollständig im Bild; Gebäude rechts fokussiert, Mila und Café getrennt sichtbar.</p></figcaption></figure><figure><a href="Screenshots/menu_2560x1080.png"><img loading="lazy" src="Screenshots/menu_2560x1080.png"></a><figcaption>menu_2560x1080.png<p>Breitbildmenü vollständig sichtbar; die neue Dekoration verändert die Aufteilung aus linkem Menü und rechtem Gebäudefokus nicht.</p></figcaption></figure><figure><a href="Screenshots/12_maximum_buildings.png"><img loading="lazy" src="Screenshots/12_maximum_buildings.png"></a><figcaption>12_maximum_buildings.png<p>Große Gebäudestufen behalten lesbare Silhouetten; zusätzliche Landschaft und Straßenleben überdecken die Gebäude nicht.</p></figcaption></figure></main></html>
